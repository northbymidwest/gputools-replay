# Spell-check allow-list for the `typos` CLI (and the CI typos check).
#
# Entries are added only as CI (or a local `typos` run) surfaces a genuine
# false positive: a reverse-engineered Apple identifier, a crate name, or a
# deliberate spelling used as an identifier. Do not add real misspellings here;
# fix those in the source instead.

[default.extend-words]
# `deviceUDID` / `setDeviceUDID:` in the class-dump artifacts: UDID (Unique
# Device Identifier) is Apple's term, not a typo of UUID.
UDID = "UDID"
# `MPSExternalNDArray...`: ND is "N-dimensional" in the Metal Performance
# Shaders API, not a typo of AND.
ND = "ND"
# `flate2`, the zlib crate: the word `flate` is not a typo of `flat`.
flate = "flate"
# `ManifestStatus::Unparseable`: a deliberate (valid) spelling used as an
# identifier in the high-level crate.
unparseable = "unparseable"
# `mis-decoded`, `mis-` prefixes: the fragment `mis` is not a typo.
mis = "mis"
# "the matched Somes": plural of Rust's `Option::Some`, used deliberately.
Somes = "Somes"
