[package]
name = "gputools-replay-sys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Raw bindings to Apple's private GPUToolsReplay framework (macOS 27, or 26 via the macos-26 feature)"
readme = "../../README.md"
keywords = ["macos", "metal", "gpu", "ffi", "gputrace"]
categories = ["external-ffi-bindings", "os::macos-apis"]
links = "GPUToolsReplay"
# Not published yet: flip by removing this line when cutting the first release.
publish = false

[dependencies]
objc2 = { workspace = true }

[features]
# Also build on macOS 26. The default floor is macOS 27 (where the ABI was
# established); macOS 26 ships the same framework minus the
# GTReplayFetchAccelerationStructure class, so acceleration-structure fetch
# returns a Setup error there and nothing else changes. See build.rs.
macos-26 = []

# docs.rs cannot host the private framework and builds on Linux; target the
# Apple platform and let build.rs's DOCS_RS branch skip linking (see build.rs).
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]
