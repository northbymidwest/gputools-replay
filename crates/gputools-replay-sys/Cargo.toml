[package]
name = "gputools-replay-sys"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Raw bindings to Apple's private GPUToolsReplay framework (macOS 27, or 26 with --no-default-features)"
readme = "README.md"
keywords = ["macos", "metal", "gpu", "ffi", "gputrace"]
categories = ["external-ffi-bindings", "os::macos-apis"]
links = "GPUToolsReplay"

[dependencies]
objc2 = { workspace = true }

[features]
default = ["macos27"]
# Require macOS 27, where the ABI was reverse-engineered: build.rs floors the
# build at 27 and the class-inventory tests are strict. Disable it
# (--no-default-features) to also build on macOS 26, which ships the same
# framework minus the GTReplayFetchAccelerationStructure class (acceleration-
# structure fetch returns a Setup error there; nothing else changes). See build.rs.
macos27 = []

# docs.rs cannot host the private framework and builds on Linux; target the
# Apple platform and let build.rs's DOCS_RS branch skip linking (see build.rs).
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]
