[package]
name = "replay-probes"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "probes"
path = "src/lib.rs"

[dependencies]
gputools-replay-sys = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
block2 = { workspace = true }
plist = { workspace = true }
thiserror = { workspace = true }

[features]
# Forward macOS 26 support to gputools-replay-sys (default floor is macOS 27).
macos-26 = ["gputools-replay-sys/macos-26"]
