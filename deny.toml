# cargo-deny config. Run in CI as `cargo deny check licenses bans sources`.
# Advisories are handled separately by audit.yml (cargo-audit against RustSec),
# so there is deliberately no [advisories] section here.

[graph]
all-features = false

[licenses]
# The union of every SPDX license in the resolved tree (surveyed from
# `cargo metadata`). `unused-allowed-license = "deny"` keeps this list honest:
# it fails if an entry here stops being needed.
allow = [
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]
unused-allowed-license = "deny"
# The workspace's own unpublished crate (replay-probes) carries no license
# field; do not flag it.
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace crates depend on each other by path (`version = "..."` + path),
# which cargo-deny sees as a path wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
