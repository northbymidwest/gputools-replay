name: release
run-name: release ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Publishes the three framework crates in dependency order (sys -> replay ->
# hl), then tags, through the shared composites in northbymidwest/gh-actions
# (see that repo's README for the design). The tag is an output of a succeeded
# release, never its trigger.
#
# hl depends on gputrace-bundle, released from its own repo FIRST: preflight
# checks that version is already on crates.io (registry-prereqs), and the
# publish job checks it out as a sibling so hl's ../gputrace-bundle path
# dependency resolves when cargo loads the workspace. Publishing runs on macOS
# because cargo publish's verify build links the private framework, with
# --no-default-features so that build's floor is one the hosted macOS 26 image
# can link.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.1.1)'
        type: string
        required: true
      dry_run:
        description: 'Stop before publishing anything'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    # Validation only: reads manifests, the changelog, and crates.io. No cargo
    # build, so no sibling checkout is needed here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.pre.outputs.publish }}
      registry: ${{ steps.pre.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pre
        uses: northbymidwest/gh-actions/release-preflight@fbbaaad718a8294de0a132bc76a2a4e3a7ccea01 # v0.2.2
        with:
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry_run }}
          crates: |
            crates/gputools-replay-sys/Cargo.toml
            crates/gputools-replay/Cargo.toml
            crates/gputools-replay-hl/Cargo.toml
          packages: |
            gputools-replay-sys
            gputools-replay
            gputools-replay-hl
          registry-prereqs: gputrace-bundle=Cargo.toml
          token: ${{ github.token }}
      - uses: northbymidwest/gh-actions/release-review-summary@fbbaaad718a8294de0a132bc76a2a4e3a7ccea01 # v0.2.2
        with:
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry_run }}
          tag: ${{ steps.pre.outputs.tag }}
          registry: ${{ steps.pre.outputs.registry }}
          what-approving-does: publishes sys, replay, hl and tags v${{ inputs.version }}
          token: ${{ github.token }}

  publish:
    needs: preflight
    environment: release
    # macOS: cargo publish's verify build links the private framework. Pin to a
    # macOS 27 label once GitHub provides one (macos-latest upgrades on its own
    # when the image reaches 27); until then --no-default-features keeps the
    # verify build's floor at what the hosted macOS 26 image can link.
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gputools-replay
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: northbymidwest/gputrace-bundle
          path: gputrace-bundle
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: northbymidwest/gh-actions/release-publish-crate@fbbaaad718a8294de0a132bc76a2a4e3a7ccea01 # v0.2.2
        with:
          packages: |
            gputools-replay-sys
            gputools-replay
            gputools-replay-hl
          publish: ${{ needs.preflight.outputs.publish }}
          args: --no-default-features
          dry-run: ${{ inputs.dry_run }}
          working-directory: gputools-replay
      - uses: northbymidwest/gh-actions/release-tag@fbbaaad718a8294de0a132bc76a2a4e3a7ccea01 # v0.2.2
        with:
          version: ${{ inputs.version }}
          deploy-key: ${{ secrets.RELEASE_TAG_KEY }}
          token: ${{ github.token }}
          dry-run: ${{ inputs.dry_run }}
          working-directory: gputools-replay
