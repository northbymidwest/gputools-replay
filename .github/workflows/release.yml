name: release
run-name: release ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Publishes the three framework crates in dependency order (sys -> replay ->
# hl), THEN tags. The tag is an output of a succeeded release, never a trigger:
# a protected v* tag is permanent the moment it lands, so a tag-triggered
# release would burn a version on any downstream failure. A failed preflight
# costs nothing.
#
# Publishing runs on the hosted macOS runner: `cargo publish`'s verify build
# links the private framework, so it needs macOS, not Ubuntu. It runs with
# --no-default-features so that verify build targets the floor the runner can
# satisfy (the hosted image is macOS 26; the macos27 default would raise the
# floor past it - see the publish steps). hl also depends on gputrace-bundle,
# so that crate must be published from its own repo FIRST (see RELEASING.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.1.0)'
        type: string
        required: true
      dry_run:
        description: 'Stop before publishing anything'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    # Validation only; no write scope, no compilation (hosted).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preflight
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          soft() { if [ "$DRY" = "true" ]; then echo "::warning::$1"; else fail "$1"; fi; }

          case "$VERSION" in
            v*) fail "version must not start with v" ;;
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) fail "version must look like MAJOR.MINOR.PATCH" ;;
          esac

          # Every publishable crate's manifest must carry this version and must
          # no longer be publish=false.
          for c in gputools-replay-sys gputools-replay gputools-replay-hl; do
            man="crates/$c/Cargo.toml"
            v=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' "$man" | head -1)
            [ "$v" = "$VERSION" ] || fail "$c version is $v, expected $VERSION"
            if grep -q '^publish = false' "$man"; then
              soft "$c is still publish=false; remove it to release"
            fi
          done

          # A changelog section for this version must exist and be non-empty.
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f=1; next} /^## / {f=0} f' \
            CHANGELOG.md > /tmp/notes.md
          grep -q '[^[:space:]]' /tmp/notes.md || fail "CHANGELOG.md has no ## $VERSION section"

          # The newest completed CI run for this commit must be green.
          sha=$(git rev-parse HEAD)
          concl=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last | .conclusion')
          [ "$concl" = "success" ] || soft "newest CI run for $sha is '$concl', not success"

  publish:
    needs: preflight
    # The crates.io trusted-publishing token is scoped to this environment; its
    # required-reviewer gate is the one human approval before an irreversible
    # upload. Restrict the environment to main in repo settings.
    environment: release
    # macOS 27: cargo publish's verify build links the framework. Pin to a
    # macOS 27 runner label once GitHub provides one (macos-latest here upgrades
    # automatically when its image reaches 27).
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      # OIDC -> short-lived crates.io token. The one step with no offline test,
      # which is why dry_run exists; obtaining a token publishes nothing.
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # Dependency order is mandatory: replay resolves sys, hl resolves replay
      # (and gputrace-bundle, published first from its own repo), against the
      # registry, so each must be live before the next.
      #
      # --no-default-features: this runner is macOS 26, and cargo publish's
      # verify build uses default features (macos27 -> floor 27), which would
      # fail here. The published crate's manifest is unchanged - default
      # features still ship - so consumers are unaffected. Same as the CI build.
      - name: Publish gputools-replay-sys
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p gputools-replay-sys --no-default-features
      - name: Publish gputools-replay
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p gputools-replay --no-default-features
      - name: Publish gputools-replay-hl
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p gputools-replay-hl --no-default-features
      # Only now: everything above can fail without leaving a mark; from here
      # the tag is permanent. The `protect version tags` ruleset restricts v*
      # creation to one bypass actor, a deploy key whose private half is the
      # `release` environment's RELEASE_TAG_KEY. GITHUB_TOKEN cannot be a bypass
      # actor, so the push goes over SSH with that key and nothing else on offer
      # (-F /dev/null, no agent). GitHub's host keys come from its API.
      - name: Tag and release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG_KEY: ${{ secrets.RELEASE_TAG_KEY }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$RELEASE_TAG_KEY" > "$dir/key"
          chmod 600 "$dir/key"
          gh api meta --jq '.ssh_keys[] | "github.com \(.)"' > "$dir/known_hosts"
          GIT_SSH_COMMAND="ssh -F /dev/null -i $dir/key -o IdentitiesOnly=yes -o IdentityAgent=none -o UserKnownHostsFile=$dir/known_hosts -o StrictHostKeyChecking=yes" \
            git push "git@github.com:${{ github.repository }}.git" "$sha:refs/tags/v$VERSION"
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > /tmp/notes.md
          gh release create "v$VERSION" --title "v$VERSION" \
            --notes-file /tmp/notes.md --prerelease --verify-tag
          echo "::notice::published $VERSION and tagged v$VERSION at $sha"
      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: echo "Dry run only. A real run would publish sys, replay, hl and tag v$VERSION." >> "$GITHUB_STEP_SUMMARY"
