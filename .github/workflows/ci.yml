name: CI

# This crate links Apple's private GPUToolsReplay framework (macOS 26+; see
# gputools-replay-sys/build.rs). Jobs that COMPILE the framework crates run on
# macos-latest, which GitHub currently provisions as macOS 26, allow-fail while
# the macOS-26 ABI is validated. Everything that does not compile them (lint,
# supply-chain, workflow lint, and - via `cargo metadata`, which does not run
# build scripts - deny/machete) runs on cheap, fast Ubuntu.
on:
  push:
  pull_request:
  # Toolchains move between commits; a weekly unprompted run catches breakage
  # that would otherwise sit unseen until the next push. Off the hour so it
  # does not queue behind everyone else's :00 cron. GitHub disables a
  # public-repo schedule after 60 days without a commit and mails the owner.
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    # fmt / ascii / typos. `cargo fmt --all` runs `cargo metadata`, which
    # resolves hl's ../gputrace-bundle path dependency, so the sibling repo is
    # checked out next to this one. Metadata does not run build scripts, so
    # nothing compiles here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gputools-replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gputools-replay
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: northbymidwest/gputrace-bundle
          path: gputrace-bundle
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: ./scripts/check-ascii.sh
      - uses: crate-ci/typos@a8168dc2984a9e2352f183ffe788f0f23a300389 # v1.49.1
        with:
          files: gputools-replay

  supply-chain:
    # cargo-deny and cargo-machete resolve metadata but do not compile the
    # framework crates (cargo metadata does not run build scripts), so they run
    # on Ubuntu. Metadata resolution needs the sibling gputrace-bundle path
    # dependency (../gputrace-bundle) checked out next to this repo.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gputools-replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gputools-replay
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: northbymidwest/gputrace-bundle
          path: gputrace-bundle
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-machete@0.9.2
      # Advisories are audit.yml's job; here it is licenses/bans/sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: gputools-replay/Cargo.toml
          command: check licenses bans sources
      - run: cargo machete

  workflows:
    # Lints the workflow files themselves (actionlint) and audits them for
    # security anti-patterns (zizmor). No compilation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          # go is preinstalled on the Ubuntu runner; pin actionlint by tag.
          SHELLCHECK_OPTS: -e SC2016
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      # Uploads findings to code scanning (non-blocking).
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github
          advanced-security: true
      # The blocking pass.
      - name: zizmor (blocking)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx install zizmor==1.29.0
          zizmor --no-progress .github

  macos:
    # Everything that COMPILES the framework crates. Runs on macos-latest, which
    # GitHub currently provisions as macOS 26 - new enough (the crate supports
    # macOS 26+; see gputools-replay-sys/build.rs). continue-on-error while the
    # macOS-26 ABI is validated; flip to blocking once it is reliably green.
    # Checks out gputrace-bundle as a sibling so hl's ../gputrace-bundle path
    # dependency resolves. The live (--ignored) tests need capture fixtures that
    # are not committed, so they run locally, not here.
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gputools-replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gputools-replay
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: northbymidwest/gputrace-bundle
          path: gputrace-bundle
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  msrv:
    # Verifies the declared MSRV floor still builds. Compiles the framework
    # crates on macos-latest (macOS 26+), allow-fail like the macos job.
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gputools-replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gputools-replay
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: northbymidwest/gputrace-bundle
          path: gputrace-bundle
          persist-credentials: false
      - name: read MSRV from Cargo.toml
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$v" || { echo '::error::no rust-version in Cargo.toml'; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo build --workspace
